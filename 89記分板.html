    .playlist-item.active { background: rgba(232, 188, 112, 0.25); border-color: var(--gold); }

      <div class="flex items-center justify-between bg-black/50 px-3 py-2 rounded-xl border border-white/10">

          <button id="btn-shuffle" onclick="toggleShuffleMode()" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1 rounded-lg text-xs font-bold shadow">🔀 隨機播放: 開</button>
        </div>
        <button onclick="playRandomSong()" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs">🎲 隨機跳轉</button>
      </div>
      <div class="relative w-full aspect-video rounded-2xl overflow-hidden border border-white/10 bg-black">
        <iframe id="youtube-player" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="text-xs font-bold text-amber-300 flex justify-between items-center px-1">
        <span>清單曲目 (15首)</span>
        <span class="text-[10px] text-gray-400">點擊即播</span>

      <div id="song-list-container" class="flex flex-col gap-1.5 max-h-[340px] overflow-y-auto pr-1"></div>
    </div>
  </div>
</section>

<script>
  let playerCount = 2;
  let scores = [0, 0];
  let foulCounts = [0, 0];
  let names = ["選手一", "選手二"];
  let activePlayer = 0;
  let phase = "idle";
  let targetScore = 7;
  let gameType = "9ball";
  let matchClockTimer = null;
  let totalElapsedSeconds = 0;

  let isLoopEnabled = false;
  let isShuffleEnabled = true;

  const specialTitles = [
    "セブン·クッション·伝説 日女演唱會01", "다크호스 3쿠션男搖滾02", "다크호스 3쿠션男搖滾01",
    "다크호스 3쿠션女搖滾01", "다크호스 3쿠션女演唱01", "다크호스 3쿠션女搖滾02",
    "三顆星極光白黃互解 02", "開侖三顆星搖滾男粵語 02", "8號撞球王 02",
    "美式三顆星對戰版 Battle06", "黑馬三顆星主題曲特輯 01", "三顆星技巧解析與進階練習",
    "球友對戰精選實錄 03", "跟著林師傅學撞球精華 01", "黑馬三顆星實戰對局 15"
  ];
  
  const playlistSongs = specialTitles.map((title, i) => ({
    title, duration: "3:45", vid: "xtT9d4avAW4", index: i
  }));
  let currentSongIndex = 0;

  document.addEventListener("DOMContentLoaded", () => {
    updatePlayerCountInputs();
    onGameTypeChange();
    if (isShuffleEnabled) currentSongIndex = Math.floor(Math.random() * playlistSongs.length);
    renderSongList();
    selectSong(currentSongIndex);
    render();
  });

  function updatePlayerCountInputs() {
    playerCount = parseInt(document.getElementById("player-count").value) || 2;
    if (scores.length < playerCount) {
      for (let i = scores.length; i < playerCount; i++) {
        scores.push(0);
        foulCounts.push(0);
        names.push(`選手${i+1}`);
      }
    } else {
      scores = scores.slice(0, playerCount);
      foulCounts = foulCounts.slice(0, playerCount);
      names = names.slice(0, playerCount);
    }
    
    const container = document.getElementById("name-inputs-container");
    container.innerHTML = names.map((name, i) => `
      <div>
        <label class="block text-[10px] text-emerald-200/70 mb-0.5">選手 ${i+1} 姓名</label>
        <input id="name-input-${i}" type="text" value="${name}" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-xs" onchange="updateNames()">
      </div>
    `).join('');
    
    const mainEl = document.getElementById("scoreboard-main");
    mainEl.className = `players-grid-${playerCount} mb-6`;
    render();
  }

  function updateNames() {
    for (let i = 0; i < playerCount; i++) {
      const input = document.getElementById(`name-input-${i}`);
      if (input) names[i] = input.value || `選手${i+1}`;
    }
    render();
  }

  function onGameTypeChange() {
    gameType = document.getElementById("game-type").value;
    const badge = document.getElementById("header-rule-badge");
    const countBox = document.getElementById("player-count-box");
    
    if (gameType === "9ball-multi") {
      countBox.classList.remove("hidden");
      playerCount = parseInt(document.getElementById("player-count").value);
      badge.textContent = `9號球 (${playerCount}人混戰)`;
    } else {
      countBox.classList.add("hidden");
      playerCount = 2;
      document.getElementById("player-count").value = "2";
      updatePlayerCountInputs();
      if (gameType === "9ball") badge.textContent = "9號球 (標準制 - 2人)";
      else if (gameType === "8ball") badge.textContent = "8號球賽制";
      else if (gameType === "14-1") badge.textContent = "14-1 Continuous";
      else if (gameType === "snooker") badge.textContent = "司諾克 (Snooker)";
      else if (gameType === "bigsmallgold") badge.textContent = "9號球 (大小金制)";
    }
    render();
  }

  function updatePlayerCount() {
    updatePlayerCountInputs();
    onGameTypeChange();
  }

  function render() {
    const mainEl = document.getElementById("scoreboard-main");
    mainEl.className = `players-grid-${playerCount} mb-6`;
    
    mainEl.innerHTML = names.slice(0, playerCount).map((name, i) => {
      const isActive = activePlayer === i;
      return `
        <article onclick="handleCardClick(${i})" ondblclick="handleCardDblClick(${i})" class="glass p-4 sm:p-5 flex flex-col justify-between bg-black/60 transition-all duration-300 ${isActive ? 'active-player' : 'inactive-player'} select-none">
          <div class="flex justify-between items-center mb-1">
            <span class="text-base sm:text-lg font-bold gold-text truncate">${name}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold ${isActive ? '' : 'hidden'}">● 擊球中</span>
          </div>
          <div class="my-2 text-center">
            <div class="led-score display-font text-5xl sm:text-7xl font-black text-white">${scores[i]}</div>
            <div class="text-xs text-red-400 font-bold mt-1">累積犯規: ${foulCounts[i]} 次</div>
          </div>
          <div class="grid grid-cols-2 gap-2" onclick="event.stopPropagation()">
            <button onclick="addScore(${i}, -1)" class="btn-action bg-emerald-800/60 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs">-1 分</button>
            <button onclick="addScore(${i}, 1)" class="btn-action bg-red-600/60 hover:bg-red-500 text-white font-extrabold py-2 rounded-xl text-xs">+1 分</button>
          </div>
        </article>
      `;
    }).join('');

    document.getElementById("target-display.textContent") = `目標搶分: ${targetScore} 分`;
    document.getElementById("elapsed-time").textContent = formatTime(totalElapsedSeconds);
  }

  function addScore(i, d) {
    if (phase === "finished") return;
    scores[i] += d;
    if (scores[i] < 0) scores[i] = 0;
    render();
    if (scores[i] >= targetScore) finishMatch(names[i]);
  }

  function handleCardClick(i) {
    if (phase === "finished") return;
    activePlayer = i;
    render();
  }

  function handleCardDblClick(i) {
    if (phase === "finished") return;
    addScore(i, 1);
  }

  function switchTurn() {
    if (phase === "finished") return;
    activePlayer = (activePlayer + 1) % playerCount;
    render();
  }

  function startMatch() {
    phase = "running";
    document.getElementById("start-btn").disabled = true;
    document.getElementById("pause-btn").disabled = false;
    document.getElementById("match-status").textContent = "比賽進行中";
    startMatchClock();
    render();
  }

  function pauseMatch() {
    phase = "paused";
    clearInterval(matchClockTimer);
    document.getElementById("pause-btn").disabled = true;
    document.getElementById("resume-btn").classList.remove("hidden");
    document.getElementById("match-status").textContent = "暫停中";
  }

  function resumeMatch() {
    phase = "running";
    document.getElementById("pause-btn").disabled = false;
    document.getElementById("resume-btn").classList.add("hidden");
    document.getElementById("match-status").textContent = "比賽進行中";
    startMatchClock();
  }

  function resetMatch() {
    clearInterval(matchClockTimer);
    scores = new Array(playerCount).fill(0);
    foulCounts = new Array(playerCount).fill(0);
    activePlayer = 0;
    phase = "idle";
    totalElapsedSeconds = 0;
    document.getElementById("start-btn").disabled = false;
    document.getElementById("pause-btn").disabled = true;
    document.getElementById("resume-btn").classList.add("hidden");
    document.getElementById("match-status").textContent = "準備中";
    render();
  }

  function startMatchClock() {
    clearInterval(matchClockTimer);
    matchClockTimer = setInterval(() => {
      if (phase === "running") {
        totalElapsedSeconds++;
        document.getElementById("elapsed-time").textContent = formatTime(totalElapsedSeconds);
      }
    }, 1000);
  }

  function formatTime(s) {
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }

  function toggleSettingsModal() {
    const m = document.getElementById("settings-modal");
    if (m.open) m.close(); else m.showModal();
  }

  function openReportModal() {
    const content = names.slice(0, playerCount).map((n, i) => `📍 ${n}：${scores[i]} 分 (犯規 ${foulCounts[i]}次)`).join('<br>');
    document.getElementById("report-content").innerHTML = `<b>【比賽戰報】</b><br>${content}<br>⏱ 總耗時：${formatTime(totalElapsedSeconds)}`;
    document.getElementById("report-modal").showModal();
  }

  function copyMatchText() {
    const text = `🏆 撞球賽事實時戰報\n` + names.slice(0, playerCount).map((n, i) => `- ${n}: ${scores[i]}分`).join('\n') + `\n⏱ 耗時: ${formatTime(totalElapsedSeconds)}`;
    navigator.clipboard.writeText(text).then(() => alert("已成功複製比賽文案！"));
  }

  function shareToFB() {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
  }

  function shareToLINE() {
    window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent("推薦您使用超好用的多功能撞球記分板 Pro！")}`, '_blank');
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => alert(err.message));
    else if (document.exitFullscreen) document.exitFullscreen();
  }

  function changeLanguage(lang) {
    document.documentElement.lang = lang;
    alert(`已切換語系為: ${lang} (hreflang 宣告已同步更新)`);
  }

  function renderSongList() {
    document.getElementById("song-list-container").innerHTML = playlistSongs.map((song, idx) => `
      <div onclick="selectSong(${idx})" class="playlist-item p-2 rounded-lg bg-black/40 border border-white/10 cursor-pointer flex justify-between items-center ${idx === currentSongIndex ? 'active' : ''}">
        <div class="flex items-center gap-2 truncate">
          <span class="text-amber-400 font-bold">${idx === currentSongIndex ? '▶' : (idx + 1)}</span>
          <span class="truncate text-white font-medium">${song.title}</span>
        </div>
        <span class="text-[10px] text-gray-400">${song.duration}</span>
      </div>
    `).join('');
  }

  function selectSong(index) {
    currentSongIndex = index;
    renderSongList();
    const song = playlistSongs[index];
    const player = document.getElementById("youtube-player");
    let extraParams = isLoopEnabled ? "&loop=1&playlist=" + song.vid : "";
    player.src = `https://www.youtube.com/embed/${song.vid}?list=PLQvBYUHGQEcU&index=${index}&autoplay=1${extraParams}`;
    document.getElementById("current-playing-title").textContent = `🎵 目前播放：${song.title}`;
  }

  function toggleLoopMode() {
    isLoopEnabled = !isLoopEnabled;
    document.getElementById("btn-loop").textContent = `🔁 單曲循環: ${isLoopEnabled ? '開' : '關'}`;
    selectSong(currentSongIndex);
  }

  function toggleShuffleMode() {
    isShuffleEnabled = !isShuffleEnabled;
    document.getElementById("btn-shuffle").textContent = `🔀 隨機播放: ${isShuffleEnabled ? '開' : '關'}`;
  }

  function playRandomSong() {
    let rand;
    do { rand = Math.floor(Math.random() * playlistSongs.length); } while (rand === currentSongIndex);
    selectSong(rand);
  }

  function finishMatch(winnerName) {
    phase = "finished";
    clearInterval(matchClockTimer);
    document.getElementById("match-status").textContent = "比賽結束";
    document.getElementById("win-summary").textContent = `🏆 恭喜 ${winnerName} 獲得勝利！\n總耗時：${formatTime(totalElapsedSeconds)}`;
    document.getElementById("win-modal").showModal();
  }
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旗艦撞球記分板 Pro - 9號球 / 14-1 / 8號球 / 大小金</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-bg: #071b19;
      --surface: rgba(19, 40, 37, 0.85);
      --gold: #e8bc70;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    html, body { width: 100%; min-height: 100vh; margin: 0; background: var(--dark-bg); color: #edf5eb; font-family: "Work Sans", sans-serif; overflow-x: hidden; }
    .glass { background: var(--surface); border: 1px solid rgba(192, 231, 209, 0.15); border-radius: 20px; backdrop-filter: blur(12px); }
    .display-font { font-family: "Fraunces", serif; }
    .gold-text { color: var(--gold); }
    .active-player { border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(232, 188, 112, 0.4); cursor: pointer; }
    .inactive-player { cursor: pointer; opacity: 0.85; border: 3px solid transparent; transition: all 0.2s; }
    .inactive-player:hover { opacity: 1; border-color: rgba(232, 188, 112, 0.5); }
    .led-score { font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); user-select: none; }
    .btn-action { transition: all 0.15s ease; user-select: none; }
    .btn-action:active { transform: scale(0.96); }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
    dialog::backdrop { background: rgba(0, 10, 10, 0.85); backdrop-filter: blur(8px); }

    /* 預設或平板模式網格 */
    main.grid-desktop { display: grid !important; grid-template-columns: minmax(0, 1fr) 260px minmax(0, 1fr) !important; grid-template-areas: "player1 center player2" !important; gap: 1rem !important; align-items: stretch; width: 100%; }
    #player-card-0 { grid-area: player1 !important; order: 1 !important; }
    .center-panel { grid-area: center !important; order: 2 !important; }
    #player-card-1 { grid-area: player2 !important; order: 3 !important; }

    /* 手機模式強制直向單欄 */
    main.grid-mobile { display: flex !important; flex-direction: column !important; gap: 1rem !important; width: 100%; }
    
    .playlist-item { transition: all 0.2s; }
    .playlist-item:hover { background: rgba(232, 188, 112, 0.15); border-color: rgba(232, 188, 112, 0.4); }
    .playlist-item.active { background: rgba(232, 188, 112, 0.25); border-color: var(--gold); }
  </style>
</head>
<body class="p-2 sm:p-6 pb-16">
<div id="zoom-container">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col gap-2 lg:flex-row lg:justify-between lg:items-center glass p-3 sm:p-5 mb-4 sm:mb-6">
      <div class="flex items-center gap-2.5">
        <div class="text-2xl sm:text-3xl">🎱</div>
        <div>
          <div class="flex items-baseline gap-2 flex-wrap">
            <h1 class="text-lg sm:text-2xl font-extrabold tracking-wider text-amber-400 display-font">多功能撞球記分板 Pro</h1>
            <span id="header-rule-badge" class="text-[10px] sm:text-xs font-semibold text-emerald-300/95 bg-emerald-950/60 border border-emerald-500/30 px-2 py-0.5 rounded-md">9號球 (標準制)</span>
          </div>
          <p class="text-[10px] sm:text-xs text-emerald-200/70 mt-0.5">點擊卡片換人擊球 ｜ 連點兩下卡片 +1分</p>
        </div>
      </div>

      <!-- 控制按鈕群組 -->
      <div class="flex flex-wrap gap-1.5 sm:gap-2 items-center justify-end">
        <button id="start-btn" onclick="startMatch()" class="btn-action bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold px-3 py-1.5 rounded-lg text-xs sm:text-sm">▶️ 開始比賽</button>
        <button id="pause-btn" onclick="pauseMatch()" class="btn-action bg-white/10 hover:bg-white/20 text-white px-2.5 py-1.5 rounded-lg text-xs sm:text-sm" disabled>⏸ 暫停</button>
        <button id="resume-btn" onclick="resumeMatch()" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-2.5 py-1.5 rounded-lg text-xs sm:text-sm hidden">▶ 繼續</button>
        <button onclick="resetMatch()" class="btn-action bg-red-900/60 hover:bg-red-800 text-red-200 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm">🔄 重設</button>
        
        <!-- 裝置模式切換 -->
        <button onclick="toggleDeviceMode()" id="device-mode-btn" class="btn-action bg-cyan-600/30 hover:bg-cyan-600/50 text-cyan-200 border border-cyan-500/40 px-2.5 py-1.5 rounded-lg text-xs font-bold">📱 手機模式</button>

        <!-- 全螢幕按鈕 -->
        <button onclick="toggleFullScreen()" class="btn-action bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-500/40 px-2.5 py-1.5 rounded-lg text-xs font-bold">⛶ 全螢幕</button>

        <!-- 社群分享 -->
        <button onclick="shareToFB()" class="btn-action bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold">📘 分享 FB</button>
        <button onclick="shareToLINE()" class="btn-action bg-green-600 hover:bg-green-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold">💚 分享 LINE</button>

        <button onclick="toggleSettingsModal()" class="btn-action px-2.5 py-1.5 text-xs font-bold rounded-lg bg-amber-400/20 text-amber-300 hover:bg-amber-400/30 border border-amber-400/40">⚙️ 賽制設定</button>
        <span id="match-status" class="px-2 py-1 text-xs rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">準備中</span>
      </div>
    </header>

    <!-- Main Scoreboard -->
    <main id="scoreboard-main" class="grid-desktop gap-3 sm:gap-4 mb-4 sm:mb-6">
      <!-- PLAYER 1 (支援單擊換人、雙擊+1分) -->
      <article id="player-card-0" onclick="handleCardClick(0)" ondblclick="handleCardDblClick(0)" class="glass p-4 sm:p-5 flex flex-col justify-between bg-black/60 transition-all duration-300 inactive-player select-none">
        <div class="flex justify-between items-center mb-1">
          <span id="name-display-0" class="text-base sm:text-xl font-bold gold-text">選手一</span>
          <span id="turn-tag-0" class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold">● 擊球中</span>
        </div>
        
        <div class="my-2 sm:my-3 text-center">
          <div id="score-0" class="led-score display-font text-6xl sm:text-8xl font-black text-white">0</div>
          <div id="foul-status-0" class="text-xs text-red-400 font-bold mt-1">累積犯規: 0 次</div>
          <div class="text-[10px] text-emerald-300/50 mt-0.5">💡 點一下換人，連點兩下 +1 分</div>
        </div>

        <!-- 14-1 專屬計分與扣分控制 -->
        <div id="14-1-controls-0" class="hidden grid grid-cols-2 gap-1.5 mb-3" onclick="event.stopPropagation()">
          <button onclick="addScore(0, 1)" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs col-span-2">⚽ 進球 (+1 分)</button>
          <button onclick="apply141Foul(0, -1)" class="btn-action bg-amber-700 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-xs">⚠️ 犯規 (-1 分)</button>
          <button onclick="apply141Foul(0, -15)" class="btn-action bg-red-800 hover:bg-red-700 text-red-100 font-bold py-1.5 rounded-lg text-xs">⛔ 3連犯 (-15 分)</button>
        </div>

        <!-- 大小金專屬控制 -->
        <div id="big-small-gold-controls-0" class="hidden grid grid-cols-2 gap-1.5 mb-3" onclick="event.stopPropagation()">
          <button onclick="addGoldScore(0, 10, '大金')" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded-lg text-xs">✨ 大金 (+10)</button>
          <button onclick="addGoldScore(0, 7, '小金')" class="btn-action bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs">⭐ 小金 (+7)</button>
          <button onclick="addGoldScore(0, 4, '普勝')" class="btn-action bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-xs">🎯 普勝 (+4)</button>
          <button onclick="handleFoul(0)" class="btn-action bg-red-800/80 hover:bg-red-700 text-red-200 font-bold py-1.5 rounded-lg text-xs">⚠️ 犯規/罰分</button>
        </div>

        <!-- 一般微調分數 -->
        <div class="action-btn-group grid grid-cols-2 gap-2" onclick="event.stopPropagation()">
          <button onclick="addScore(0, -1)" id="btn-minus-0" class="btn-action bg-emerald-800/60 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs">-1 分</button>
          <button onclick="addScore(0, 1)" id="btn-plus-0" class="btn-action bg-red-600/60 hover:bg-red-500 text-white font-extrabold py-2 rounded-xl text-xs">+1 分</button>
        </div>
      </article>

      <!-- CENTER PANEL -->
      <section class="glass center-panel p-4 sm:p-5 flex flex-col justify-between text-center items-center">
        <div>
          <div id="target-display" class="text-base sm:text-xl font-black text-amber-300 tracking-wide">目標搶分: 7 分</div>
          <div id="rule-display" class="text-xs text-emerald-200/80 mt-1">規則：標準 9 號球搶分</div>
        </div>

        <!-- 14-1 檯面剩餘球數與結算區 -->
        <div id="14-1-center-box" class="hidden w-full bg-black/40 border border-amber-400/30 p-2.5 rounded-xl my-2">
          <span class="text-xs text-amber-300 font-bold block mb-1">本輪檯面球數</span>
          <div class="flex justify-center items-center gap-2">
            <span id="balls-left-count" class="text-2xl font-black text-amber-400">14</span>
            <span class="text-xs text-emerald-200/60">/ 14 顆球</span>
          </div>
          <button onclick="finish141Rack()" class="btn-action w-full mt-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-1.5 rounded-lg text-xs shadow">
            🔄 打完14顆，結算重排
          </button>
        </div>

        <button id="switch-btn" onclick="switchTurn()" class="btn-action w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold py-2.5 rounded-xl text-sm my-1">⇦ 換人擊球</button>

        <div class="bg-black/40 border border-white/10 rounded-xl px-2 py-1.5 w-full text-center">
          <span class="text-[10px] text-emerald-200/60 block">比賽計時</span>
          <span id="elapsed-time" class="text-base sm:text-lg font-bold text-amber-300 font-mono">00:00</span>
        </div>
      </section>

      <!-- PLAYER 2 (支援單擊換人、雙擊+1分) -->
      <article id="player-card-1" onclick="handleCardClick(1)" ondblclick="handleCardDblClick(1)" class="glass p-4 sm:p-5 flex flex-col justify-between bg-black/60 transition-all duration-300 inactive-player select-none">
        <div class="flex justify-between items-center mb-1">
          <span id="name-display-1" class="text-base sm:text-xl font-bold gold-text">選手二</span>
          <span id="turn-tag-1" class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold hidden">● 擊球中</span>
        </div>
        
        <div class="my-2 sm:my-3 text-center">
          <div id="score-1" class="led-score display-font text-6xl sm:text-8xl font-black text-white">0</div>
          <div id="foul-status-1" class="text-xs text-red-400 font-bold mt-1">累積犯規: 0 次</div>
          <div class="text-[10px] text-emerald-300/50 mt-0.5">💡 點一下換人，連點兩下 +1 分</div>
        </div>

        <!-- 14-1 專屬計分與扣分控制 -->
        <div id="14-1-controls-1" class="hidden grid grid-cols-2 gap-1.5 mb-3" onclick="event.stopPropagation()">
          <button onclick="addScore(1, 1)" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs col-span-2">⚽ 進球 (+1 分)</button>
          <button onclick="apply141Foul(1, -1)" class="btn-action bg-amber-700 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-xs">⚠️ 犯規 (-1 分)</button>
          <button onclick="apply141Foul(1, -15)" class="btn-action bg-red-800 hover:bg-red-700 text-red-100 font-bold py-1.5 rounded-lg text-xs">⛔ 3連犯 (-15 分)</button>
        </div>

        <!-- 大小金專屬控制 -->
        <div id="big-small-gold-controls-1" class="hidden grid grid-cols-2 gap-1.5 mb-3" onclick="event.stopPropagation()">
          <button onclick="addGoldScore(1, 10, '大金')" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded-lg text-xs">✨ 大金 (+10)</button>
          <button onclick="addGoldScore(1, 7, '小金')" class="btn-action bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs">⭐ 小金 (+7)</button>
          <button onclick="addGoldScore(1, 4, '普勝')" class="btn-action bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-xs">🎯 普勝 (+4)</button>
          <button onclick="handleFoul(1)" class="btn-action bg-red-800/80 hover:bg-red-700 text-red-200 font-bold py-1.5 rounded-lg text-xs">⚠️ 犯規/罰分</button>
        </div>

        <!-- 一般微調分數 -->
        <div class="action-btn-group grid grid-cols-2 gap-2" onclick="event.stopPropagation()">
          <button onclick="addScore(1, -1)" id="btn-minus-1" class="btn-action bg-emerald-800/60 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs">-1 分</button>
          <button onclick="addScore(1, 1)" id="btn-plus-1" class="btn-action bg-red-600/60 hover:bg-red-500 text-white font-extrabold py-2 rounded-xl text-xs">+1 分</button>
        </div>
      </article>
    </main>
  </div>
</div>

<!-- 設定 Dialog -->
<dialog id="settings-modal" class="p-6 text-white glass border border-amber-400/50 rounded-3xl max-w-lg w-full shadow-2xl">
  <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
    <h2 class="text-xl font-bold text-amber-300">⚙️ 賽制與規則設定</h2>
    <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
  </div>
  <div class="space-y-4">
    <div>
      <label class="block text-xs text-emerald-300 mb-1 font-bold">選擇球局類型</label>
      <select id="game-type" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm font-bold text-amber-300" onchange="onGameTypeChange()">
        <option value="14-1">14-1 (14.1 Continuous)</option>
        <option value="9ball" selected>9號球 (標準制)</option>
        <option value="8ball">8號球</option>
        <option value="bigsmallgold">9號球 (大小金制)</option>
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs text-emerald-300 mb-1 font-bold">預設搶分設定</label>
        <select id="target-score" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm" onchange="updateMatchSettings()">
          <option value="50">50 分 (14-1建議)</option>
          <option value="100">100 分 (14-1建議)</option>
          <option value="7" selected>搶 7 分</option>
          <option value="9">搶 9 分</option>
          <option value="11">搶 11 分</option>
          <option value="custom">自訂分數</option>
        </select>
      </div>
      <div id="custom-score-box" class="hidden">
        <label class="block text-xs text-emerald-300 mb-1 font-bold">自訂目標分</label>
        <input id="custom-target-input" type="number" value="7" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm font-bold text-center" onchange="updateMatchSettings()">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3 pt-2">
      <div>
        <label class="block text-xs text-emerald-200/70 mb-1">選手一 姓名</label>
        <input id="name-input-0" type="text" value="選手一" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm" onchange="updateNames()">
      </div>
      <div>
        <label class="block text-xs text-emerald-200/70 mb-1">選手二 姓名</label>
        <input id="name-input-1" type="text" value="選手二" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm" onchange="updateNames()">
      </div>
    </div>
  </div>
  <div class="mt-6 text-right">
    <button onclick="toggleSettingsModal(); startMatch();" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm">儲存並開始</button>
  </div>
</dialog>

<!-- 勝者 Dialog -->
<dialog id="win-modal" class="p-6 text-center text-white glass border border-amber-400/40 rounded-3xl max-w-md w-full">
  <div class="text-4xl mb-2">🏆</div>
  <h2 class="text-2xl font-black text-amber-300 mb-2">比賽獲勝！</h2>
  <p id="win-summary" class="text-lg font-bold text-white mb-4"></p>
  <button onclick="document.getElementById('win-modal').close(); resetMatch();" class="bg-amber-400 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl">重新開始新賽局</button>
</dialog>

<!-- YouTube 音樂播放區塊 -->
<section class="glass media-section p-4 sm:p-5 mb-6 max-w-7xl mx-auto">
  <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between mb-3">
    <div class="flex items-center gap-2">
      <span class="text-lg sm:text-xl">🎧</span>
      <h2 class="text-base sm:text-lg font-bold text-amber-400">黑馬音樂頻道 ‧ 播放清單選歌 (15首)</h2>
    </div>
    <div class="text-xs text-emerald-200/70" id="current-playing-title">🎵 目前播放：載入中...</div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
    <!-- 影片播放器與上方控制列 (佔 2 欄) -->
    <div class="lg:col-span-2 flex flex-col gap-2">
      <div class="flex items-center justify-between bg-black/50 px-3 py-2 rounded-xl border border-white/10">
        <div class="flex items-center gap-2">
          <span class="text-xs text-emerald-300 font-bold">播放模式：</span>
          <button id="btn-loop" onclick="toggleLoopMode()" class="btn-action bg-emerald-600/40 hover:bg-emerald-600 text-emerald-200 border border-emerald-500/50 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
            <span>🔁</span> <span id="loop-text">單曲循環: 關</span>
          </button>
          <button id="btn-shuffle" onclick="toggleShuffleMode()" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 border border-amber-300 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shadow">
            <span>🔀</span> <span id="shuffle-text">隨機播放: 開</span>
          </button>
        </div>
        <button onclick="playRandomSong()" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs">🎲 隨機跳轉</button>
      </div>

      <!-- YouTube 嵌入播放框 -->
      <div class="relative w-full aspect-video rounded-2xl overflow-hidden border border-white/10 bg-black">
        <iframe id="youtube-player" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>

    <!-- 右側 15 首歌曲清單 (可捲動) -->
    <div class="flex flex-col gap-2">
      <div class="text-xs font-bold text-amber-300 flex justify-between items-center px-1">
        <span>清單曲目 (15首)</span>
        <span class="text-[10px] text-gray-400">點擊即播</span>
      </div>
      <div id="song-list-container" class="flex flex-col gap-1.5 max-h-[340px] lg:max-h-[380px] overflow-y-auto pr-1">
        <!-- JS 動態生成 15 首清單 -->
      </div>
    </div>
  </div>
</section>

<script>
  let scores = [0, 0];
  let foulCounts = [0, 0];
  let names = ["選手一", "選手二"];
  let activePlayer = 0;
  let phase = "idle";
  let targetScore = 7;
  let gameType = "9ball";
  let matchClockTimer = null;
  let totalElapsedSeconds = 0;
  let ballsLeftInRack = 14;
  let currentDeviceMode = "auto";

  let isLoopEnabled = false;
  let isShuffleEnabled = true;

  const specialTitles = [
    "セブン·クッション·伝説 日女演唱會01",
    "다크호스 3쿠션男搖滾02",
    "다크호스 3쿠션男搖滾01",
    "다크호스 3쿠션女搖滾01",
    "다크호스 3쿠션女演唱01",
    "다크호스 3쿠션女搖滾02",
    "三顆星極光白黃互解 02",
    "開侖三顆星搖滾男粵語 02",
    "8號撞球王 02",
    "美式三顆星對戰版 Battle06",
    "黑馬三顆星主題曲特輯 01",
    "三顆星技巧解析與進階練習",
    "球友對戰精選實錄 03",
    "跟著林師傅學撞球精華 01",
    "黑馬三顆星實戰對局 15"
  ];
  
  const playlistSongs = [];
  for (let i = 0; i < 15; i++) {
    playlistSongs.push({
      title: specialTitles[i] || `Carom 3cushion song ${String(i + 1).padStart(3, '0')}`,
      duration: "3:45",
      vid: "xtT9d4avAW4",
      index: i
    });
  }
  let currentSongIndex = 0;

  document.addEventListener("DOMContentLoaded", () => {
    onGameTypeChange();
    if (isShuffleEnabled && playlistSongs.length > 0) {
      currentSongIndex = Math.floor(Math.random() * playlistSongs.length);
    }
    renderSongList();
    selectSong(currentSongIndex);
    render();
  });

  function renderSongList() {
    const container = document.getElementById("song-list-container");
    container.innerHTML = playlistSongs.map((song, idx) => `
      <div onclick="selectSong(${idx})" class="playlist-item p-2 rounded-lg bg-black/40 border border-white/10 cursor-pointer flex justify-between items-center ${idx === currentSongIndex ? 'active' : ''}">
        <div class="flex items-center gap-2 truncate">
          <span class="text-amber-400 font-bold">${idx === currentSongIndex ? '▶' : (idx + 1)}</span>
          <span class="truncate text-white font-medium">${song.title}</span>
        </div>
        <span class="text-[10px] text-gray-400 whitespace-nowrap ml-2">${song.duration}</span>
      </div>
    `).join('');
  }

  function selectSong(index) {
    currentSongIndex = index;
    renderSongList();
    const song = playlistSongs[index];
    const player = document.getElementById("youtube-player");
    let extraParams = isLoopEnabled ? "&loop=1&playlist=" + song.vid : "";
    player.src = `https://www.youtube.com/embed/${song.vid}?list=PLQvBYUHGQEcU&index=${index}&autoplay=1${extraParams}`;
    document.getElementById("current-playing-title").textContent = `🎵 目前播放：${song.title}`;
  }

  function toggleLoopMode() {
    isLoopEnabled = !isLoopEnabled;
    const btn = document.getElementById("btn-loop");
    const txt = document.getElementById("loop-text");
    if (isLoopEnabled) {
      btn.className = "btn-action bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-400 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shadow";
      txt.textContent = "單曲循環: 開";
    } else {
      btn.className = "btn-action bg-emerald-600/40 hover:bg-emerald-600 text-emerald-200 border border-emerald-500/50 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1";
      txt.textContent = "單曲循環: 關";
    }
    selectSong(currentSongIndex);
  }

  function toggleShuffleMode() {
    isShuffleEnabled = !isShuffleEnabled;
    const btn = document.getElementById("btn-shuffle");
    const txt = document.getElementById("shuffle-text");
    if (isShuffleEnabled) {
      btn.className = "btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 border border-amber-300 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shadow";
      txt.textContent = "隨機播放: 開";
      playRandomSong();
    } else {
      btn.className = "btn-action bg-white/10 hover:bg-white/25 text-white px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1";
      txt.textContent = "隨機播放: 關";
    }
  }

  function playRandomSong() {
    if (playlistSongs.length === 0) return;
    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * playlistSongs.length);
    } while (randomIndex === currentSongIndex && playlistSongs.length > 1);
    selectSong(randomIndex);
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`無法啟用全螢幕: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  function toggleDeviceMode() {
    const mainEl = document.getElementById("scoreboard-main");
    const btnEl = document.getElementById("device-mode-btn");

    if (currentDeviceMode === "auto") {
      currentDeviceMode = "mobile";
      mainEl.className = "grid-mobile gap-3 sm:gap-4 mb-4 sm:mb-6";
      btnEl.textContent = "💻 平板/大螢幕";
    } else if (currentDeviceMode === "mobile") {
      currentDeviceMode = "tablet";
      mainEl.className = "grid-desktop gap-3 sm:gap-4 mb-4 sm:mb-6";
      btnEl.textContent = "⚡ 自動適應";
    } else {
      currentDeviceMode = "auto";
      mainEl.className = "grid-desktop gap-3 sm:gap-4 mb-4 sm:mb-6";
      btnEl.textContent = "📱 手機模式";
    }
  }

  function shareToFB() {
    const url = encodeURIComponent(window.location.href);
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
  }

  function shareToLINE() {
    const text = encodeURIComponent("推薦您使用超好用的多功能撞球記分板 Pro！");
    const url = encodeURIComponent(window.location.href);
    window.open(`https://social-plugins.line.me/lineit/share?url=${url}&text=${text}`, '_blank');
  }

  function toggleSettingsModal() {
    const m = document.getElementById("settings-modal");
    if (m.open) m.close(); else m.showModal();
  }

  function onGameTypeChange() {
    gameType = document.getElementById("game-type").value;
    const badge = document.getElementById("header-rule-badge");
    const ruleDesc = document.getElementById("rule-display");
    
    const is141 = (gameType === "14-1");
    const isGold = (gameType === "bigsmallgold");

    document.getElementById("14-1-controls-0").classList.toggle("hidden", !is141);
    document.getElementById("14-1-controls-1").classList.toggle("hidden", !is141);
    document.getElementById("14-1-center-box").classList.toggle("hidden", !is141);

    document.getElementById("big-small-gold-controls-0").classList.toggle("hidden", !isGold);
    document.getElementById("big-small-gold-controls-1").classList.toggle("hidden", !isGold);

    if (is141) {
      badge.textContent = "14-1 Continuous";
      ruleDesc.textContent = "規則：進球+1分/犯規扣分/14顆結算";
    } else if (gameType === "8ball") {
      badge.textContent = "8號球賽制";
      ruleDesc.textContent = "規則：標準 8 號球計分";
    } else if (isGold) {
      badge.textContent = "9號球 (大小金制)";
      ruleDesc.textContent = "規則：大金10分 / 小金7分 / 普勝4分";
    } else {
      badge.textContent = "9號球 (標準制)";
      ruleDesc.textContent = "規則：標準 9 號球搶分";
    }
    updateMatchSettings();
  }

  function updateMatchSettings() {
    const targetSelect = document.getElementById("target-score").value;
    const customBox = document.getElementById("custom-score-box");
    
    if (targetSelect === "custom") {
      customBox.classList.remove("hidden");
      targetScore = parseInt(document.getElementById("custom-target-input").value) || 7;
    } else {
      customBox.classList.add("hidden");
      targetScore = parseInt(targetSelect);
    }
    document.getElementById("target-display").textContent = `目標搶分: ${targetScore} 分`;
    render();
  }

  function updateNames() {
    names[0] = document.getElementById("name-input-0").value || "選手一";
    names[1] = document.getElementById("name-input-1").value || "選手二";
    document.getElementById("name-display-0").textContent = names[0];
    document.getElementById("name-display-1").textContent = names[1];
  }

  function render() {
    for (let i = 0; i < 2; i++) {
      document.getElementById(`score-${i}`).textContent = scores[i];
      document.getElementById(`foul-status-${i}`).textContent = `累積犯規: ${foulCounts[i]} 次`;
      
      const isActive = activePlayer === i;
      document.getElementById(`player-card-${i}`).classList.toggle("active-player", isActive);
      document.getElementById(`player-card-${i}`).classList.toggle("inactive-player", !isActive);
      document.getElementById(`turn-tag-${i}`).classList.toggle("hidden", !isActive);
    }
    
    document.getElementById("balls-left-count").textContent = ballsLeftInRack;
    document.getElementById("elapsed-time").textContent = formatTime(totalElapsedSeconds);
    document.getElementById("switch-btn").textContent = activePlayer === 0 ? `⇦ ${names[0]} 打完，換 ${names[1]}` : `${names[1]} 打完，換 ${names[0]} ⇨`;
  }

  function formatTime(s) {
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }

  function startMatch() {
    phase = "running";
    document.getElementById("start-btn").disabled = true;
    document.getElementById("pause-btn").disabled = false;
    document.getElementById("match-status").textContent = "比賽進行中";
    startMatchClock();
    render();
  }

  function pauseMatch() {
    phase = "paused";
    clearInterval(matchClockTimer);
    document.getElementById("pause-btn").disabled = true;
    document.getElementById("resume-btn").classList.remove("hidden");
    document.getElementById("match-status").textContent = "暫停中";
  }

  function resumeMatch() {
    phase = "running";
    document.getElementById("pause-btn").disabled = false;
    document.getElementById("resume-btn").classList.add("hidden");
    document.getElementById("match-status").textContent = "比賽進行中";
    startMatchClock();
  }

  function resetMatch() {
    clearInterval(matchClockTimer);
    scores = [0, 0];
    foulCounts = [0, 0];
    ballsLeftInRack = 14;
    activePlayer = 0;
    phase = "idle";
    totalElapsedSeconds = 0;
    document.getElementById("start-btn").disabled = false;
    document.getElementById("pause-btn").disabled = true;
    document.getElementById("resume-btn").classList.add("hidden");
    document.getElementById("match-status").textContent = "準備中";
    render();
  }

  function startMatchClock() {
    clearInterval(matchClockTimer);
    matchClockTimer = setInterval(() => {
      if (phase === "running") {
        totalElapsedSeconds++;
        document.getElementById("elapsed-time").textContent = formatTime(totalElapsedSeconds);
      }
    }, 1000);
  }

  function handleCardClick(i) {
    if (phase === "finished") return;
    activePlayer = i;
    render();
  }

  function handleCardDblClick(i) {
    if (phase === "finished") return;
    addScore(i, 1);
  }

  function switchTurn() {
    if (phase === "finished") return;
    activePlayer = 1 - activePlayer;
    render();
  }

  function addScore(i, d) {
    if (phase === "finished") return;
    
    if (gameType === "14-1" && d > 0) {
      if (ballsLeftInRack > 0) {
        ballsLeftInRack--;
      }
      foulCounts[i] = 0;
    }
    
    scores[i] += d;
    if (scores[i] < 0) scores[i] = 0;
    render();
    if (scores[i] >= targetScore) finishMatch(names[i]);
  }

  function apply141Foul(playerIdx, penalty) {
    if (phase === "finished") return;
    scores[playerIdx] += penalty;
    if (penalty === -15) {
      alert(`⛔ ${names[playerIdx]} 發生連續 3 次犯規！懲罰扣除 15 分！`);
      foulCounts[playerIdx] = 0;
    } else {
      foulCounts[playerIdx]++;
      alert(`⚠️ ${names[playerIdx]} 犯規！扣除 1 分 (累積連犯: ${foulCounts[playerIdx]} 次)`);
    }
    render();
    if (scores[playerIdx] >= targetScore) finishMatch(names[playerIdx]);
  }

  function finish141Rack() {
    alert(`🎉 本輪 14 顆球已打完！\n請將桌上進的 14 顆球重新排三角框（保留第 15 顆球位置與母球），準備繼續打下一輪！`);
    ballsLeftInRack = 14;
    render();
  }

  function addGoldScore(playerIdx, points, typeName) {
    if (phase === "finished") return;
    scores[playerIdx] += points;
    alert(`🎉 ${names[playerIdx]} 打出【${typeName}】獲得 +${points} 分！`);
    render();
    if (scores[playerIdx] >= targetScore) finishMatch(names[playerIdx]);
  }

  function handleFoul(foulPlayerIdx) {
    if (phase === "finished") return;
    const opponentIdx = 1 - foulPlayerIdx;
    foulCounts[foulPlayerIdx]++;
    if (foulCounts[foulPlayerIdx] >= 3) {
      scores[opponentIdx] += 2;
      alert(`⚠️ ${names[foulPlayerIdx]} 累計達 3 次犯規！${names[opponentIdx]} 獲得 2 分，該局結束。`);
      foulCounts = [0, 0];
    } else {
      scores[opponentIdx] += 1;
      alert(`⚠️ ${names[foulPlayerIdx]} 發生犯規，${names[opponentIdx]} +1 分。`);
    }
    render();
    if (scores[opponentIdx] >= targetScore) finishMatch(names[opponentIdx]);
  }

  function finishMatch(winnerName) {
    phase = "finished";
    clearInterval(matchClockTimer);
    document.getElementById("match-status").textContent = "比賽結束";
    document.getElementById("win-summary").textContent = `🏆 恭喜 ${winnerName} 獲得勝利！\n總耗時：${formatTime(totalElapsedSeconds)}`;
    document.getElementById("win-modal").showModal();
  }
</script>
</body>
</html>

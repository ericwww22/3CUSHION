<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title id="page-title">黑馬三顆星 - 旗艦賽事記分板 Pro 2026</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Fraunces:wght@700;900&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       基本設定
       ========================================================= */

    :root {
      --dark-bg: #071b19;
      --surface: rgba(19, 40, 37, 0.85);
      --gold: #e8bc70;
      --zoom-factor: 1;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: var(--dark-bg);
      color: #edf5eb;
      font-family: "Work Sans", sans-serif;

      min-height: 100vh;

      overflow-x: hidden;
      overflow-y: auto !important;
    }

    #zoom-container {
      transform-origin: top center;
      transition: transform 0.15s ease-out;

      width: 100%;
      min-width: 0;
    }

    .glass {
      background: var(--surface);
      border: 1px solid rgba(192, 231, 209, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .display-font {
      font-family: "Fraunces", serif;
    }

    .gold-text {
      color: var(--gold);
    }

    /* =========================================================
       玩家卡片
       ========================================================= */

    .active-player {
      border: 3px solid var(--gold);

      box-shadow:
        0 0 30px rgba(232, 188, 112, 0.4);

      cursor: pointer;
    }

    .inactive-player {
      cursor: pointer;

      opacity: 0.85;

      border: 3px solid transparent;

      transition: all 0.2s;
    }

    .inactive-player:hover {
      opacity: 1;

      border-color:
        rgba(232, 188, 112, 0.5);
    }

    /* =========================================================
       LED 分數
       ========================================================= */

    .led-score {
      font-variant-numeric: tabular-nums;

      line-height: 1;

      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.6);

      cursor: pointer;

      user-select: none;
    }

    .led-yellow {
      color: #ffe066 !important;

      text-shadow:
        0 0 12px rgba(255, 224, 102, 0.7);
    }

    .led-white {
      color: #ffffff !important;

      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.65);
    }

    .led-red {
      color: #ff4d4d !important;

      text-shadow:
        0 0 12px rgba(255, 77, 77, 0.75);
    }

    /* =========================================================
       按鈕
       ========================================================= */

    .btn-action {
      transition: all 0.15s ease;

      user-select: none;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-action:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }

    dialog::backdrop {
      background: rgba(0, 10, 10, 0.85);

      backdrop-filter: blur(8px);
    }

    /* =========================================================
       歷史面板
       ========================================================= */

    .history-panel {
      position: fixed;

      top: 0;
      right: -400px;

      width: 380px;
      max-width: 90vw;

      height: 100vh;

      background: var(--surface);

      border-left:
        1px solid rgba(232, 188, 112, 0.3);

      backdrop-filter: blur(20px);

      transition:
        right 0.3s ease;

      z-index: 10000;

      overflow-y: auto;

      padding: 20px;
    }

    .history-panel.open {
      right: 0;
    }

    .history-item {
      background:
        rgba(0, 0, 0, 0.3);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      border-radius: 12px;

      padding: 12px;

      margin-bottom: 10px;

      cursor: pointer;

      transition: all 0.2s;
    }

    .history-item:hover {
      border-color: var(--gold);

      background:
        rgba(232, 188, 112, 0.1);
    }

    .history-item .winner {
      color: var(--gold);

      font-weight: bold;
    }

    /* =========================================================
       播放清單選單樣式
       ========================================================= */
    .playlist-item {
      transition: all 0.2s ease;
    }
    .playlist-item:hover {
      background: rgba(232, 188, 112, 0.15);
      border-color: rgba(232, 188, 112, 0.4);
    }
    .playlist-item.active {
      background: rgba(232, 188, 112, 0.25);
      border-color: var(--gold);
    }

    /* =========================================================
       ★★★ 主記分板排序 (支援多球員網格) ★★★
       ========================================================= */

    main.grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) !important;
      gap: 1rem !important;
      align-items: stretch;
      width: 100%;
    }

    .center-panel {
      order: 99 !important;
    }

    @media (min-width: 1025px) {
      main.grid.mode-2p {
        grid-template-columns: minmax(0, 1fr) 248px minmax(0, 1fr) !important;
        grid-template-areas: "player1 center player2" !important;
      }
      main.grid.mode-2p #player-card-0 { grid-area: player1 !important; order: 1 !important; }
      main.grid.mode-2p .center-panel { grid-area: center !important; order: 2 !important; }
      main.grid.mode-2p #player-card-1 { grid-area: player2 !important; order: 3 !important; }
    }

  </style>
</head>

<body class="p-2 sm:p-6 pb-16">

<div id="zoom-container">

  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <header class="flex flex-col gap-2 lg:flex-row lg:justify-between lg:items-center glass p-3 sm:p-5 mb-4 sm:mb-6">
      <div class="flex items-center gap-2.5">
        <div class="text-2xl sm:text-3xl">🐴</div>
        <div>
          <div class="flex items-baseline gap-2 flex-wrap">
            <h1 id="app-title-main" class="text-lg sm:text-2xl font-extrabold tracking-wider text-amber-400 display-font">黑馬三顆星 Pro</h1>
            <span class="text-[10px] sm:text-xs font-semibold text-emerald-300/90 bg-emerald-950/60 border border-emerald-500/30 px-2 py-0.5 rounded-md">
              2026 Edition
            </span>
          </div>
          <p class="text-[10px] sm:text-xs text-emerald-200/70 mt-0.5">DARK HORSE 3-CUSHION MATCH SYSTEM</p>
        </div>
      </div>

      <!-- 控制列 -->
      <div class="flex flex-wrap gap-1.5 sm:gap-2 items-center justify-end">
        
        <!-- 語言切換選單 -->
        <select id="lang-select" onchange="changeLanguage(this.value)" class="btn-action bg-slate-900 border border-amber-400/50 text-amber-300 font-bold px-2.5 py-1.5 rounded-lg text-xs">
          <option value="zh-TW" selected>🇹🇼 繁體中文</option>
          <option value="zh-CN">🇨🇳 简体中文</option>
          <option value="en">🇬🇧 English</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="vi">🇻🇳 Tiếng Việt</option>
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="nl">🇳🇱 Nederlands</option>
        </select>

        <button id="btn-start" onclick="startMatch()" class="btn-action bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold px-3 py-1.5 rounded-lg text-xs sm:text-sm shadow-md">
          ▶️ 開始比賽
        </button>

        <button id="btn-pause" onclick="pauseMatch()" class="btn-action bg-white/10 hover:bg-white/20 text-white px-2.5 py-1.5 rounded-lg text-xs sm:text-sm" disabled>
          ⏸ 暫停
        </button>

        <button id="btn-resume" onclick="resumeMatch()" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-2.5 py-1.5 rounded-lg text-xs sm:text-sm hidden">
          ▶ 繼續
        </button>

        <button id="btn-reset" onclick="resetMatch()" class="btn-action bg-red-900/60 hover:bg-red-800 text-red-200 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm">
          🔄 重設
        </button>

        <button id="btn-report" onclick="generateReport()" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs sm:text-sm">
          📸 戰報
        </button>

        <span class="text-white/20">|</span>

        <button id="btn-history" onclick="toggleHistoryPanel()" class="btn-action px-2 py-1 text-xs font-bold rounded-lg bg-emerald-600/20 text-emerald-300 hover:bg-emerald-600/30 border border-emerald-500/40">
          📜 歷史
        </button>

        <button id="btn-settings" onclick="toggleSettingsModal()" class="btn-action px-2 py-1 text-xs font-bold rounded-lg bg-amber-400/20 text-amber-300 hover:bg-amber-400/30 border border-amber-400/40">
          ⚙️ 設定
        </button>

        <span id="match-status" class="px-2 py-1 text-xs rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
          準備中
        </span>

        <!-- 縮放 -->
        <div class="flex items-center bg-white/10 border border-white/20 rounded-lg overflow-hidden">
          <button onclick="adjustZoom(-0.08)" class="px-2 py-1 text-xs font-bold hover:bg-white/20 text-white transition">-</button>
          <span id="zoom-level-display" class="px-1 text-xs font-mono text-amber-300">100%</span>
          <button onclick="adjustZoom(0.08)" class="px-2 py-1 text-xs font-bold hover:bg-white/20 text-white transition">+</button>
          <button onclick="resetZoom()" class="px-1.5 py-1 text-xs hover:bg-white/20 text-emerald-200 border-l border-white/10">↺</button>
        </div>
      </div>
    </header>

    <!-- ★★★ 主記分板 -->
    <main id="scoreboard-main" class="grid mode-2p gap-3 sm:gap-4 mb-4 sm:mb-6">
      <section id="center-panel-box" class="glass center-panel p-4 sm:p-5 flex flex-col justify-between text-center items-center">
        <div>
          <div id="target-display" class="text-base sm:text-xl font-black text-amber-300 tracking-wide">目標 15 分</div>
        </div>
        <div class="bg-black/40 border border-white/10 rounded-xl px-2 py-1 w-full text-center my-0.5 sm:my-1">
          <span id="txt-progress" class="text-[10px] text-emerald-200/60 block">當前進程</span>
          <span id="current-inning-display" class="text-xs sm:text-base font-bold text-emerald-200">第 1 桿</span>
        </div>
        <button id="switch-btn" onclick="switchTurn()" class="btn-action w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold py-2.5 sm:py-3 rounded-xl text-base sm:text-lg my-0.5 sm:my-1">⇦ 失誤 / 換人</button>
        <div class="bg-black/40 border border-white/10 rounded-xl px-2 py-1 w-full text-center my-0.5 sm:my-1">
          <span id="txt-match-time" class="text-[10px] text-emerald-200/60 block">比賽時間</span>
          <span id="elapsed-time" class="text-sm sm:text-lg font-bold text-amber-300 font-mono">00:00</span>
        </div>
        <div class="w-full my-0.5 sm:my-1">
          <span id="timer-label" class="text-[10px] sm:text-[11px] text-emerald-200/60 block mb-0.5">Shot Clock</span>
          <div id="timer" class="display-font text-4xl sm:text-5xl font-black led-score text-white my-0.5">40</div>
          <div class="w-full bg-white/10 h-1.5 sm:h-2 rounded-full overflow-hidden mt-0.5 sm:mt-1">
            <div id="timer-bar" class="bg-amber-400 h-full w-full transition-all duration-200"></div>
          </div>
        </div>
        
        <button id="undo-btn" onclick="undoLastAction()" class="btn-action w-full bg-purple-600/80 hover:bg-purple-600 text-white font-extrabold py-2 rounded-xl text-sm shadow-md my-1" disabled>
          ↩️ 撤回上一動
        </button>

        <p id="txt-footer-quote" class="text-[10px] text-emerald-100/50 mt-1 hidden sm:block">黑馬三顆星 ‧ 就是這樣中！</p>
      </section>
    </main>

    <!-- YouTube / Podcasts Section -->
    <section class="glass media-section p-4 sm:p-5 mb-6">
      <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-lg sm:text-xl">🎧</span>
          <h2 id="playlist-header-title" class="text-base sm:text-lg font-bold text-amber-400">黑馬音樂頻道 ‧ 播放清單選歌 (完整曲目)</h2>
        </div>
        <div class="flex gap-2">
          <button onclick="switchMedia('playlist')" id="tab-playlist" class="btn-action px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 font-extrabold text-xs sm:text-sm">▶️ 播放清單</button>
          <button onclick="switchMedia('podcasts')" id="tab-podcasts" class="btn-action px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-extrabold text-xs sm:text-sm">🎙️ Podcasts</button>
        </div>
      </div>

      <div id="media-playlist">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
          <div class="lg:col-span-2 flex flex-col gap-2">
            <div class="flex items-center justify-between bg-black/50 px-3 py-2 rounded-xl border border-white/10">
              <div class="flex items-center gap-2">
                <span id="txt-play-mode" class="text-xs text-emerald-300 font-bold">播放模式：</span>
                <button id="btn-loop" onclick="toggleLoopMode()" class="btn-action bg-emerald-600/40 hover:bg-emerald-600 text-emerald-200 border border-emerald-500/50 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                  <span>🔁</span> <span id="loop-text">單曲循環: 關</span>
                </button>
                <button id="btn-shuffle" onclick="toggleShuffleMode()" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 border border-amber-300 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                  <span>🔀</span> <span id="shuffle-text">隨機播放: 開</span>
                </button>
              </div>
              <button id="btn-manual-shuffle" onclick="playRandomSong()" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-2.5 py-1 rounded-lg text-xs flex items-center gap-1 shrink-0">
                <span>▶</span> 隨機跳轉
              </button>
            </div>

            <div class="relative w-full overflow-hidden rounded-xl bg-black/80 border border-white/10 shadow-2xl" style="aspect-ratio:16/9;">
              <iframe id="youtube-player" class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/xtT9d4avAW4?list=PLQvBYUHGQEcU" title="Playlist" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <div class="bg-black/40 px-3 py-2 rounded-xl border border-white/10">
              <span id="current-playing-title" class="text-xs text-amber-300 font-bold truncate block">🎵 播放中...</span>
            </div>
          </div>

          <div class="bg-black/50 border border-white/10 rounded-xl p-3 flex flex-col h-[340px] sm:h-[405px] lg:h-[455px] overflow-hidden">
            <div class="text-xs font-bold text-amber-300 mb-2 pb-1 border-b border-white/10 flex justify-between items-center shrink-0">
              <span id="txt-playlist-title">🎵 完整曲目清單</span>
              <span id="song-count-badge" class="text-[10px] text-emerald-300">共 0 首</span>
            </div>
            <div id="song-list-container" class="overflow-y-auto space-y-2 pr-1 flex-1 text-xs"></div>
          </div>
        </div>
      </div>
    </section>

  </div>

</div>

<!-- 歷史面板 -->
<div id="history-panel" class="history-panel">
  <div class="flex justify-between items-center mb-4">
    <h3 id="txt-history-title" class="text-lg font-bold text-amber-400">📜 對局歷史</h3>
    <button onclick="toggleHistoryPanel()" class="text-gray-400 hover:text-white text-xl">&times;</button>
  </div>
  <div id="history-list"></div>
  <div class="mt-4 pt-4 border-t border-white/10">
    <button id="btn-clear-history" onclick="clearHistory()" class="btn-action w-full bg-red-900/60 hover:bg-red-800 text-red-200 py-2 rounded-xl text-sm">清除所有歷史</button>
  </div>
</div>

<!-- 設定 Dialog -->
<dialog id="settings-modal" class="p-6 text-white glass border border-amber-400/50 rounded-3xl max-w-3xl w-full shadow-2xl">
  <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
    <h2 id="txt-settings-title" class="text-xl font-bold text-amber-300">⚙️ 賽事與系統設定</h2>
    <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
  </div>
  <div class="space-y-6 max-h-[70vh] overflow-y-auto pr-2">
    
    <div>
      <h3 id="txt-mode-setting" class="text-sm font-bold text-emerald-300 mb-2">🎮 對打模式設定</h3>
      <div class="bg-black/40 p-3 rounded-xl border border-white/10">
        <label id="txt-select-mode" class="block text-xs text-emerald-200/70 mb-1">選擇對打人數 / 模式</label>
        <select id="match-mode-select" class="w-full bg-slate-900 border border-amber-400/50 text-amber-300 font-bold rounded-lg p-2 text-sm" onchange="onMatchModeChange()">
          <option value="2p" selected>👥 雙人對打模式 (白 / 黃)</option>
          <option value="3p">🔴 3人對打模式 (白 / 黃 / 紅)</option>
          <option value="4p">🟡 4人對打模式 (白 / 黃 / 白 / 黃)</option>
        </select>
      </div>
    </div>

    <div>
      <h3 id="txt-player-setting" class="text-sm font-bold text-emerald-300 mb-2">👤 選手與母球</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-black/40 p-3 rounded-xl border border-white/10">
        <div>
          <label id="txt-p1-name" class="block text-xs text-emerald-200/70 mb-1">選手一 姓名</label>
          <input id="name-input-0" type="text" value="林師傅" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm font-bold" onchange="updateNames()">
        </div>
        <div>
          <label id="txt-p1-ball" class="block text-xs text-emerald-200/70 mb-1">選手一 母球</label>
          <select id="ball-color-0" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm font-bold" onchange="onBallColorChange()">
            <option value="white" selected>⚪ 白球</option>
            <option value="yellow">🟡 黃球</option>
          </select>
        </div>
        <div>
          <label id="txt-p2-name" class="block text-xs text-emerald-200/70 mb-1">選手二 姓名</label>
          <input id="name-input-1" type="text" value="黑馬" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm font-bold" onchange="updateNames()">
        </div>
        <div>
          <label id="txt-p2-ball" class="block text-xs text-emerald-200/70 mb-1">選手二 母球</label>
          <select id="ball-color-1" class="w-full bg-slate-900/60 border border-white/10 rounded-lg p-2 text-sm font-bold text-gray-400" disabled>
            <option value="yellow" selected>🟡 黃球</option>
            <option value="white">⚪ 白球</option>
          </select>
        </div>

        <div id="player-3-box" class="hidden">
          <label id="txt-p3-name" class="block text-xs text-emerald-200/70 mb-1">選手三 姓名</label>
          <input id="name-input-2" type="text" value="選手三" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm font-bold" onchange="updateNames()">
        </div>
        <div id="player-3-ball-box" class="hidden">
          <label id="txt-p3-ball" class="block text-xs text-emerald-200/70 mb-1">選手三 母球</label>
          <input id="ball-color-2-display" type="text" value="🔴 紅球" class="w-full bg-slate-900/60 border border-white/10 rounded-lg p-2 text-sm font-bold text-red-400" disabled>
        </div>

        <div id="player-4-box" class="hidden">
          <label id="txt-p4-name" class="block text-xs text-emerald-200/70 mb-1">選手四 姓名</label>
          <input id="name-input-3" type="text" value="選手四" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm font-bold" onchange="updateNames()">
        </div>
        <div id="player-4-ball-box" class="hidden">
          <label id="txt-p4-ball" class="block text-xs text-emerald-200/70 mb-1">選手四 母球</label>
          <input id="ball-color-3-display" type="text" value="🟡 黃球" class="w-full bg-slate-900/60 border border-white/10 rounded-lg p-2 text-sm font-bold text-yellow-300" disabled>
        </div>
      </div>
    </div>

    <div>
      <h3 id="txt-rules-setting" class="text-sm font-bold text-emerald-300 mb-2">🎯 賽制規則</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-black/40 p-3 rounded-xl border border-white/10">
        <div>
          <label id="txt-target-score" class="block text-xs text-emerald-200/70 mb-1">目標分數</label>
          <select id="target-score" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm" onchange="updateTargetDisplay()">
            <option value="15" selected>15 分</option>
            <option value="25">25 分</option>
            <option value="30">30 分</option>
            <option value="40">40 分</option>
            <option value="50">50 分</option>
          </select>
        </div>
        <div>
          <label id="txt-shot-clock" class="block text-xs text-emerald-200/70 mb-1">Shot Clock</label>
          <select id="shot-duration" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2 text-sm" onchange="updateShotDuration()">
            <option value="30">30 秒</option>
            <option value="40" selected>40 秒</option>
            <option value="50">50 秒</option>

  function saveStateSnapshot() {
    const snapshot = {
      scores: [...scores],
      innings: [...innings],
      currentRuns: [...currentRuns],
      highRuns: [...highRuns],
      timeouts: [...timeouts],
      activePlayer,
      phase,
      remaining,
      totalElapsedSeconds,
      isTimeoutPrompt
    };
    actionHistory.push(snapshot);
    if (actionHistory.length > 30) actionHistory.shift();
  }

  function undoLastAction() {
    if (actionHistory.length === 0) return;
    const lastState = actionHistory.pop();

    scores = [...lastState.scores];
    innings = [...lastState.innings];
    currentRuns = [...lastState.currentRuns];
    highRuns = [...lastState.highRuns];
    timeouts = [...lastState.timeouts];
    activePlayer = lastState.activePlayer;
    phase = lastState.phase;
    remaining = lastState.remaining;
    totalElapsedSeconds = lastState.totalElapsedSeconds;
    isTimeoutPrompt = lastState.isTimeoutPrompt;

    if (phase === "running") {
      document.getElementById("btn-start").disabled = true;
      document.getElementById("btn-pause").disabled = false;
      document.getElementById("btn-resume").classList.add("hidden");
      document.getElementById("match-status").textContent = t("statusRunning");
      startTimer();
      startMatchClock();
    }

    render();
  }

  function renderSongList() {
    const container = document.getElementById("song-list-container");
    container.innerHTML = playlistSongs.map((song, idx) => `
      <div onclick="selectSong(${idx})" class="playlist-item p-2 rounded-lg bg-black/40 border border-white/10 cursor-pointer flex justify-between items-center ${idx === currentSongIndex ? 'active' : ''}">
        <div class="flex items-center gap-2 truncate">
          <span class="text-amber-400 font-bold">${idx === currentSongIndex ? '▶' : (idx + 1)}</span>
          <span class="truncate text-white font-medium">${song.title}</span>
        </div>
        <span class="text-[10px] text-gray-400 whitespace-nowrap ml-2">${song.duration}</span>
      </div>
    `).join('');
  }

  function selectSong(index) {
    currentSongIndex = index;
    renderSongList();
    const song = playlistSongs[index];
    const player = document.getElementById("youtube-player");
    let extraParams = isLoopEnabled ? "&loop=1&playlist=" + song.vid : "";
    player.src = `https://www.youtube.com/embed/${song.vid}?list=PLQvBYUHGQEcU&index=${index}&autoplay=1${extraParams}`;
    document.getElementById("current-playing-title").textContent = `${t("nowPlaying")}${song.title}`;
  }

    isLoopEnabled = !isLoopEnabled;
    document.getElementById("loop-text").textContent = isLoopEnabled ? t("loopOn") : t("loopOff");

    isShuffleEnabled = !isShuffleEnabled;
    document.getElementById("shuffle-text").textContent = isShuffleEnabled ? t("shuffleOn") : t("shuffleOff");

  function playRandomSong() {
    if (playlistSongs.length === 0) return;
    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * playlistSongs.length);
    } while (randomIndex === currentSongIndex && playlistSongs.length > 1);
    selectSong(randomIndex);

    const m = document.getElementById("settings-modal");
    if (m.open) m.close();
    else m.showModal();

  function toggleHistoryPanel() {
    const panel = document.getElementById("history-panel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) loadHistory();

  function formatTime(s) {
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }

  function adjustZoom(delta) {
    currentZoom = Math.min(Math.max(0.6, currentZoom + delta), 1.4);
    applyZoom();
  }

  function resetZoom() {
    currentZoom = 1.0;
    applyZoom();
  }

  function applyZoom() {
    document.documentElement.style.setProperty("--zoom-factor", currentZoom);
    document.getElementById("zoom-level-display").textContent = `${Math.round(currentZoom * 100)}%`;
  }

  function onBallColorChange() {
    const select = document.getElementById("ball-color-0");
    if (!select) return;

    if (playerMode === "2p") {
      const c = select.value;
      ballColors = c === "white" ? ["white", "yellow"] : ["yellow", "white"];
      document.getElementById("ball-color-1").value = ballColors[1];
    } else if (playerMode === "3p") {
      const c = select.value;
      ballColors = c === "white" ? ["white", "yellow", "red"] : ["yellow", "white", "red"];
    } else if (playerMode === "4p") {
      const c = select.value;
      ballColors = c === "white" ? ["white", "yellow", "white", "yellow"] : ["yellow", "white", "yellow", "white"];
    }

    for (let i = 0; i < playerCount; i++) {
      const e = document.getElementById(`score-${i}`);
      if (e) {
        e.classList.toggle("led-white", ballColors[i] === "white");
        e.classList.toggle("led-yellow", ballColors[i] === "yellow");
        e.classList.toggle("led-red", ballColors[i] === "red");
      }
    }
    updateNames();
  }

  function updateNames() {
    for (let i = 0; i < playerCount; i++) {
      const input = document.getElementById(`name-input-${i}`);
      if (input) names[i] = input.value || `Player ${i + 1}`;
      
      const ballKey = ballColors[i] === "white" ? "ballWhite" : (ballColors[i] === "yellow" ? "ballYellow" : "ballRed");
      const nameDisp = document.getElementById(`name-display-${i}`);
      if (nameDisp) nameDisp.textContent = `${names[i]} (${t(ballKey)})`;
    }
  }

  function updateTargetDisplay() {
    targetScore = parseInt(document.getElementById("target-score").value);
    document.getElementById("target-display").textContent = `${t("target")} ${targetScore} ${t("points")}`;
  }

  function updateTimeoutSettings() {
    maxTimeouts = parseInt(document.getElementById("timeout-limit").value);
    timeouts = Array(playerCount).fill(maxTimeouts);
    render();
  }

  function updateShotDuration() {
    duration = parseInt(document.getElementById("shot-duration").value);
    if (phase !== "running") remaining = duration;
    render();
  }

  function setupDoubleTapHandlers() {
    for (let i = 0; i < playerCount; i++) {
      const scoreEl = document.getElementById(`score-${i}`);
      if (!scoreEl) continue;
      scoreEl.addEventListener("dblclick", (e) => {
        e.preventDefault();
        e.stopPropagation();
        triggerScoreDoubleTap(i);
      });
    }
  }

  function triggerScoreDoubleTap(playerIndex) {
    if (phase === "finished") return;
    saveStateSnapshot();
    if (activePlayer !== playerIndex) {
      innings[activePlayer]++;
      currentRuns[activePlayer] = 0;
      activePlayer = playerIndex;
      remaining = duration;
      isTimeoutPrompt = false;
    }
    addScore(playerIndex, 1, false);
  }

  function render() {
    for (let i = 0; i < playerCount; i++) {
      const scoreEl = document.getElementById(`score-${i}`);
      if (!scoreEl) continue;

      scoreEl.textContent = scores[i] || 0;
      document.getElementById(`inning-${i}`).textContent = innings[i] || 0;
      document.getElementById(`hr-${i}`).textContent = highRuns[i] || 0;
      document.getElementById(`avg-${i}`).textContent = (innings[i] && innings[i] > 0) ? (scores[i] / innings[i]).toFixed(3) : "0.000";
      document.getElementById(`timeout-count-${i}`).textContent = `${t('timeoutRemain')} ${timeouts[i] || 0} ${t('timeoutTimes')}`;

      const isActive = activePlayer === i;
      const card = document.getElementById(`player-card-${i}`);
      card.classList.toggle("active-player", isActive);
      card.classList.toggle("inactive-player", !isActive);
      document.getElementById(`turn-tag-${i}`).classList.toggle("hidden", !isActive);

      document.getElementById(`btn-plus-${i}`).disabled = !(activePlayer === i && phase !== "finished");
      document.getElementById(`btn-minus-${i}`).disabled = !(activePlayer === i && phase !== "finished" && scores[i] > 0);
      document.getElementById(`btn-timeout-${i}`).disabled = !(activePlayer === i && phase === "running" && timeouts[i] > 0);
    }

    const undoBtn = document.getElementById("undo-btn");
    if (undoBtn) undoBtn.disabled = actionHistory.length === 0;

    if (isTimeoutPrompt) {
      document.getElementById("timer").textContent = "Time?";
      document.getElementById("timer-label").textContent = t("shotClock");
    } else {
      document.getElementById("timer").textContent = remaining;
      document.getElementById("timer-label").textContent = t("shotClock");
    }

    document.getElementById("timer-bar").style.width = `${Math.max(0, (remaining / duration) * 100)}%`;
    document.getElementById("elapsed-time").textContent = formatTime(totalElapsedSeconds);

    const maxInning = Math.max(...innings.slice(0, playerCount));
    document.getElementById("current-inning-display").textContent = `${t("inningText")} ${maxInning + 1} ${t("inningSuffix")}`;
  }

  function startMatch() {
    if (phase === "finished") resetMatch();
    updateNames();
    updateTargetDisplay();
    duration = parseInt(document.getElementById("shot-duration").value);
    remaining = duration;
    phase = "running";
    isTimeoutPrompt = false;

    document.getElementById("btn-start").disabled = true;
    document.getElementById("btn-pause").disabled = false;
    document.getElementById("btn-resume").classList.add("hidden");
    document.getElementById("match-status").textContent = t("statusRunning");

    startTimer();
    startMatchClock();
    render();
  }

  function pauseMatch() {
    if (phase !== "running") return;
    phase = "paused";
    clearInterval(timer);
    clearInterval(matchClockTimer);

    document.getElementById("btn-start").disabled = true;
    document.getElementById("btn-pause").disabled = true;
    document.getElementById("btn-resume").classList.remove("hidden");
    document.getElementById("match-status").textContent = t("statusPaused");
    render();
  }

  function resumeMatch() {
    if (phase !== "paused") return;
    phase = "running";
    document.getElementById("btn-start").disabled = true;
    document.getElementById("btn-pause").disabled = false;
    document.getElementById("btn-resume").classList.add("hidden");
    document.getElementById("match-status").textContent = t("statusRunning");
    startTimer();
    startMatchClock();
    render();
  }

  function resetMatch() {
    clearInterval(timer);
    clearInterval(matchClockTimer);
    actionHistory = [];
    scores = Array(playerCount).fill(0);
    innings = Array(playerCount).fill(0);
    currentRuns = Array(playerCount).fill(0);
    highRuns = Array(playerCount).fill(0);
    timeouts = Array(playerCount).fill(maxTimeouts);
    activePlayer = 0;
    phase = "idle";
    remaining = duration;
    totalElapsedSeconds = 0;
    isTimeoutPrompt = false;

    document.getElementById("btn-start").disabled = false;
    document.getElementById("btn-pause").disabled = true;
    document.getElementById("btn-resume").classList.add("hidden");
    document.getElementById("match-status").textContent = t("statusReady");
    render();
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      if (phase !== "running" || isTimeoutPrompt) return;
      remaining--;
      if (remaining <= 0) {
        isTimeoutPrompt = true;
        render();
      } else {
        render();
      }
    }, 1000);
  }

  function startMatchClock() {
    clearInterval(matchClockTimer);
    matchClockTimer = setInterval(() => {
      if (phase === "running") {
        totalElapsedSeconds++;
        document.getElementById("elapsed-time").textContent = formatTime(totalElapsedSeconds);
      }
    }, 1000);
  }

  function useTimeout(i) {
    if (phase !== "running" || activePlayer !== i || timeouts[i] <= 0) return;
    saveStateSnapshot();
    timeouts[i]--;
    remaining += duration;
    isTimeoutPrompt = false;
    render();
  }

  function handleCardClick(targetPlayerIndex) {
    if (phase === "finished") return;
    if (activePlayer !== targetPlayerIndex) {
      saveStateSnapshot();
      innings[activePlayer]++;
      currentRuns[activePlayer] = 0;
      activePlayer = targetPlayerIndex;
      remaining = duration;
      isTimeoutPrompt = false;
      render();
    }
  }

  function addScore(i, d, shouldSave = true) {
    if (phase === "finished" || activePlayer !== i) return;
    if (shouldSave) saveStateSnapshot();
    if (d > 0) {
      scores[i] += d;
      currentRuns[i] += d;
      if (currentRuns[i] > highRuns[i]) highRuns[i] = currentRuns[i];
      render();
      if (scores[i] >= targetScore) finishMatch(names[i]);
    } else if (d < 0 && scores[i] > 0) {
      scores[i] += d;
      currentRuns[i] = Math.max(0, currentRuns[i] + d);
      render();
    }
  }

  function switchTurn() {
    if (phase === "finished") return;
    saveStateSnapshot();
    innings[activePlayer]++;
    currentRuns[activePlayer] = 0;
    activePlayer = (activePlayer + 1) % playerCount;
    remaining = duration;
    isTimeoutPrompt = false;
    render();
  }

  function finishMatch(winnerName) {
    phase = "finished";
    clearInterval(timer);
    clearInterval(matchClockTimer);
    document.getElementById("match-status").textContent = t("statusOver");
    document.getElementById("win-summary").textContent = `${t("winnerTitle")}${winnerName}！(${formatTime(totalElapsedSeconds)})`;
    document.getElementById("win-modal").showModal();
    saveHistory(winnerName);
  }

  function saveHistory(winner) {
    const h = JSON.parse(localStorage.getItem("darkhorse_history") || "[]");
    h.unshift({
      date: new Date().toISOString(),
      names: [...names.slice(0, playerCount)],
      scores: [...scores.slice(0, playerCount)],
      targetScore,
      duration: totalElapsedSeconds,
      winner
    });
    localStorage.setItem("darkhorse_history", JSON.stringify(h.slice(0, 50)));
  }

  function loadHistory() {
    const list = document.getElementById("history-list");
    const h = JSON.parse(localStorage.getItem("darkhorse_history") || "[]");
    if (!h.length) {
      list.innerHTML = `<p class="text-gray-400 text-sm text-center py-8">No History</p>`;
      return;
    }
    list.innerHTML = h.map((g, i) => `
      <div class="history-item">
        <div class="flex justify-between mb-2">
          <span class="text-xs text-gray-400">${new Date(g.date).toLocaleDateString()}</span>
          <span class="winner text-xs">🏆 ${g.winner}</span>
        </div>
        <div class="flex justify-between text-sm">
          <span>${g.names.join(" / ")}</span>
          <span class="font-bold">${g.scores.join(" - ")}</span>
        </div>
      </div>
    `).join("");
  }

  function clearHistory() {
    if (confirm("Clear all history?")) {
      localStorage.removeItem("darkhorse_history");
      loadHistory();
    }
  }

  function generateReport() {
    const c = document.getElementById("report-canvas");
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0c1815";
    ctx.fillRect(0, 0, 1080, 1080);
    ctx.strokeStyle = "#e8bc70";
    ctx.lineWidth = 12;
    ctx.strokeRect(20, 20, 1040, 1040);

    ctx.fillStyle = "#e8bc70";
    ctx.font = "bold 52px Fraunces, serif";
    ctx.textAlign = "center";
    ctx.fillText("DARK HORSE 3-CUSHION REPORT", 540, 100);

    const cardWidth = Math.floor(960 / playerCount) - 20;
    for (let i = 0; i < playerCount; i++) {
      const x = 60 + i * (cardWidth + 20);
      const isW = scores[i] === Math.max(...scores.slice(0, playerCount));

      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(x, 200, cardWidth, 680);
      ctx.strokeStyle = isW ? "#e8bc70" : "rgba(255,255,255,0.1)";
      ctx.lineWidth = isW ? 6 : 2;
      ctx.strokeRect(x, 200, cardWidth, 680);

      ctx.fillStyle = "#e8bc70";
      ctx.font = "bold 28px Work Sans, sans-serif";
      ctx.fillText(names[i], x + cardWidth / 2, 270);

      ctx.fillStyle = ballColors[i] === "yellow" ? "#ffe066" : (ballColors[i] === "red" ? "#ff4d4d" : "#ffffff");
      ctx.font = "bold 80px Fraunces, serif";
      ctx.fillText(scores[i], x + cardWidth / 2, 420);

      ctx.fillStyle = "#cbd5e1";
      ctx.font = "22px Work Sans, sans-serif";
      ctx.fillText(`Inning: ${innings[i]}`, x + cardWidth / 2, 520);
      ctx.fillText(`AVG: ${innings[i] > 0 ? (scores[i] / innings[i]).toFixed(3) : "0.000"}`, x + cardWidth / 2, 580);

      if (isW) {
        ctx.fillStyle = "#e8bc70";
        ctx.font = "bold 28px Work Sans, sans-serif";
        ctx.fillText("WINNER", x + cardWidth / 2, 780);
      }
    }

    const link = document.createElement("a");
    link.download = `Match_Report_${new Date().toISOString().split("T")[0]}.png`;
    link.href = c.toDataURL("image/png");
    link.click();
  }

  function switchMedia(mode) {
    const pl = document.getElementById("media-playlist");
    const tp = document.getElementById("tab-playlist");
    const tpc = document.getElementById("tab-podcasts");
    if (mode === "playlist") {
      pl.classList.remove("hidden");
      tp.className = "btn-action px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 font-extrabold text-xs sm:text-sm";
      tpc.className = "btn-action px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-extrabold text-xs sm:text-sm";
    } else {
      pl.classList.add("hidden");
      tpc.className = "btn-action px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 font-extrabold text-xs sm:text-sm";
      tp.className = "btn-action px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-extrabold text-xs sm:text-sm";
    }
  }

</script>

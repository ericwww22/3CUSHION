<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑馬三顆星 - 開侖記分板音樂系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }

        /* 左側曲目清單側邊欄 */
        #music-sidebar {
            width: 320px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .sidebar-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: #ffca28;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 播放控制按鈕區 */
        .controls-area {
            margin-bottom: 15px;
        }

        .btn-random {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .btn-random:hover {
            background: linear-gradient(135deg, #ffa726, #fb8c00);
        }

        /* 播放清單列表 */
        .playlist-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .playlist-item {
            padding: 12px;
            background-color: #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            font-size: 0.9rem;
        }

        .playlist-item:hover {
            background-color: #383838;
            border-left-color: #ffb300;
        }

        .playlist-item.active {
            background-color: #332a00;
            border-left-color: #ffca28;
            color: #ffca28;
            font-weight: bold;
        }

        /* 播放器容器 (左側底部) */
        .player-box {
            margin-top: 15px;
            border-top: 1px solid #444;
            padding-top: 15px;
        }

        iframe {
            width: 100%;
            height: 180px;
            border-radius: 6px;
            border: none;
        }

        /* 右側記分板主畫面區域 */
        #scoreboard-main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0a0a0a;
        }
    </style>
</head>
<body>

    <!-- 左側曲目清單面板 -->
    <div id="music-sidebar">
        <div class="sidebar-header">
            <h2>🎵 撞球音樂曲目清單</h2>
        </div>

        <div class="controls-area">
            <button class="btn-random" onclick="playRandomPlaylist()">🔀 隨機播放主題曲</button>
        </div>

        <!-- 7 大主題曲目清單 -->
        <div class="playlist-container" id="playlist-list">
            <!-- 由 JavaScript 動態生成項目 -->
        </div>

        <!-- 底層 YouTube 音樂播放器 -->
        <div class="player-box">
            <iframe id="yt-player" 
                    src="https://www.youtube.com/embed?listType=playlist&list=PLTWtZQRj3Afo&autoplay=0" 
                    allow="autoplay; encrypted-media">
            </iframe>
        </div>
    </div>

    <!-- 右側開侖記分板主畫面區域 -->
    <div id="scoreboard-main">
        <h1 style="color: #ffca28; margin-bottom: 10px;">黑馬三顆星 開侖記分板</h1>
        <p style="color: #aaa;">點擊左側曲目清單即可切換音樂背景播放</p>
    </div>

    <script>
        // 7 大主題播放清單資料
        const playlists = [
            { name: "史記-三顆星系列歌曲", id: "PLTWtZQRj3Afo" },
            { name: "三國三顆星", id: "PLdpKckWsf_Hc" },
            { name: "西遊記三顆星_專輯", id: "PLPfZirXdQMO4" },
            { name: "開侖三顆星 (粵語)", id: "PLUbsc9" },
            { name: "Carom 3Cushion Billiards Songs (英文)", id: "PLNYp7Ajdp7fE" },
            { name: "캐롬 3쿠션 음악 (韓文)", id: "PLFECxAA36pDU" },
            { name: "スリークッション・ビリヤードの曲 (日文)", id: "PLD3X6znNGj6Y" }
        ];

        // 渲染左側清單
        function renderPlaylists() {
            const container = document.getElementById('playlist-list');
            container.innerHTML = '';

            playlists.forEach((pl, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === 0 ? 'active' : ''}`;
                item.innerText = `${index + 1}. ${pl.name}`;
                item.onclick = () => selectPlaylist(index);
                container.appendChild(item);
            });
        }

        // 切換指定的播放清單
        function selectPlaylist(index) {
            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === index);
            });

            const selected = playlists[index];
            const player = document.getElementById('yt-player');
            player.src = `https://www.youtube.com/embed?listType=playlist&list=${selected.id}&autoplay=1&shuffle=1`;
        }

        // 隨機選擇清單播放
        function playRandomPlaylist() {
            const randomIndex = Math.floor(Math.random() * playlists.length);
            selectPlaylist(randomIndex);
        }

        // 初始化
        window.onload = () => {
            renderPlaylists();
        };
    </script>
</body>
</html>

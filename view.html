<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑馬撞球賽事系統｜選手觀戰中心 (唯讀快照)</title>
  <meta name="description" content="黑馬撞球賽事選手觀戰中心，提供唯讀賽程對戰表、即時比分與名次查詢、球員戰績排行與快照分享。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
    }
    .viewer-readonly .editor-only,
    .viewer-readonly [data-editor-only="true"] {
      display: none !important;
    }
    .viewer-readonly .match-card-interactive {
      cursor: default !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col viewer-readonly">
  <!-- 頂部導覽列 -->
  <header class="bg-slate-900/95 border-b border-slate-800 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
          <i class="fa-solid fa-eye text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="displayTitle" class="text-base sm:text-lg font-black text-white tracking-wide">撞球賽事觀戰中心</h1>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              唯讀觀戰模式
            </span>
          </div>
          <p id="displaySubtitle" class="text-xs text-slate-400">即時快照檢視 · 僅供瀏覽與查詢</p>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span id="snapStatusBadge" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 font-semibold">
          <i class="fa-solid fa-circle-info mr-1 text-indigo-400"></i>等待快照載入
        </span>
      </div>
    </div>
  </header>

  <!-- 唯讀提示橫幅 -->
  <div id="playerLiveBanner" class="bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 border-b border-indigo-500/30">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm">
      <div class="flex items-center gap-2 text-indigo-200">
        <i class="fa-solid fa-shield-halved text-indigo-400"></i>
        <span>目前為<strong>選手觀戰快照（唯讀）</strong>，無法直接修改比分或賽程設定。</span>
      </div>
      <div id="metaSummaryBar" class="text-slate-300 text-xs flex flex-wrap items-center gap-3"></div>
    </div>
  </div>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    <!-- 選手賽程與名次查詢區 -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div>
          <h2 class="text-base font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-user-check text-emerald-400"></i>
            選手賽程與狀態查詢
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">選擇選手即可查看目前戰績、下一場對手與賽程位置</p>
        </div>
        <div class="w-full sm:w-72">
          <select id="playerLookupSelect" onchange="renderPlayerPersonalStatus()"
            class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option value="">-- 請選擇選手 --</option>
          </select>
        </div>
      </div>
      <div id="playerPersonalStatusBox" class="bg-slate-950/70 border border-slate-800 rounded-xl p-4 text-sm text-slate-300">
        尚未選擇選手，或目前快照中無選手資料。
      </div>
    </section>

    <!-- 賽程與對戰總覽 -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-base font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-sitemap text-amber-400"></i>
          賽程對戰表
        </h2>
        <span id="bracketModeBadge" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-800 text-amber-300 border border-slate-700">
          單敗淘汰賽
        </span>
      </div>
      <div id="bracketContainer" class="overflow-x-auto custom-scrollbar pb-2">
        <div class="text-sm text-slate-400 py-6 text-center">尚未載入賽程快照。</div>
      </div>
    </section>

    <!-- 選手名單與戰績總覽 -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
      <h2 class="text-base font-black text-white flex items-center gap-2 mb-4">
        <i class="fa-solid fa-users text-sky-400"></i>
        參賽選手與搶局資訊
      </h2>
      <div id="playerStandingsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="text-sm text-slate-400 col-span-full py-4 text-center">無選手資料</div>
      </div>
    </section>
  </main>

  <!-- 提示訊息 Toast -->
  <div id="toastBox" class="fixed bottom-5 right-5 z-50 hidden max-w-sm bg-slate-800 text-white text-xs sm:text-sm font-semibold px-4 py-3 rounded-xl border border-slate-600 shadow-2xl"></div>

  <script>
    const MAX_PLAYERS = 128;

    const state = {
      readOnlyViewer: true,
      viewerShareLocked: true,
      format: 'single', // single | double | roundrobin
      players: [],
      matches: [],
      meta: {
        title: '撞球賽事觀戰中心',
        host: '',
        date: '',
        location: '',
        event: ''
      },
      activePlayerId: ''
    };

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      if (!box) return;
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        box.classList.add('hidden');
      }, 3200);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function decodeSnapshotBase64Url(b64url) {
      const clean = String(b64url || '').trim();
      if (!clean) throw new Error('Empty snapshot');
      const b64 = clean.replace(/-/g, '+').replace(/_/g, '/');
      const padLen = (4 - (b64.length % 4)) % 4;
      const padded = b64 + '='.repeat(padLen);
      const bin = atob(padded);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      return JSON.parse(jsonStr);
    }

    function hasSafeTournamentIds(payload) {
      if (!Array.isArray(payload.players)) return false;
      return payload.players.every((p) => {
        if (!p || p.id === undefined || p.id === null) return true;
        return typeof p.id === 'string' && p.id.length <= 64 && !/[<>]/.test(p.id);
      });
    }

    function applyTournamentPayload(payload, options = {}) {
      if (!payload || !Array.isArray(payload.players) || payload.players.length < 2 || payload.players.length > MAX_PLAYERS) {
        return false;
      }
      if (!hasSafeTournamentIds(payload)) {
        return false;
      }

      const importedIds = payload.players.map((p, idx) => p.id || `p_${idx + 1}`);
      if (new Set(importedIds).size !== importedIds.length) {
        return false;
      }

      state.players = payload.players.slice(0, MAX_PLAYERS).map((p, idx) => ({
        id: p.id || `p_${idx + 1}`,
        name: String(p.name || `選手 ${idx + 1}號`).slice(0, 40),
        race: Math.min(30, Math.max(1, parseInt(p.race, 10) || 7)),
        noShow: Boolean(p.noShow)
      }));

      state.format = ['single', 'double', 'roundrobin'].includes(payload.format)
        ? payload.format
        : 'single';

      state.matches = Array.isArray(payload.matches) ? payload.matches : [];

      if (payload.meta && typeof payload.meta === 'object') {
        state.meta = {
          title: String(payload.meta.title || '撞球賽事觀戰中心').slice(0, 80),
          host: String(payload.meta.host || '').slice(0, 60),
          date: String(payload.meta.date || '').slice(0, 40),
          location: String(payload.meta.location || '').slice(0, 60),
          event: String(payload.meta.event || '').slice(0, 60)
        };
      }

      renderMetaHeader();
      populatePlayerLookupSelect();
      renderPlayerPersonalStatus();
      renderAll();
      return true;
    }

    function renderMetaHeader() {
      const titleEl = document.getElementById('displayTitle');
      const subEl = document.getElementById('displaySubtitle');
      const barEl = document.getElementById('metaSummaryBar');

      if (titleEl) titleEl.textContent = state.meta.title || '撞球賽事觀戰中心';

      const parts = [];
      if (state.meta.event) parts.push(`項目：${state.meta.event}`);
      if (state.meta.host) parts.push(`主辦：${state.meta.host}`);
      if (state.meta.date) parts.push(`日期：${state.meta.date}`);
      if (state.meta.location) parts.push(`地點：${state.meta.location}`);

      if (subEl) {
        subEl.textContent = parts.length ? parts.join(' · ') : '唯讀快照檢視 · 僅供瀏覽與查詢';
      }
      if (barEl) {
        barEl.innerHTML = parts.map((p) => `<span class="px-2 py-0.5 rounded bg-slate-800/90 text-slate-200">${escapeHtml(p)}</span>`).join('');
      }
    }

    function getPlayerById(id) {
      return state.players.find((p) => p.id === id) || null;
    }

    function populatePlayerLookupSelect() {
      const select = document.getElementById('playerLookupSelect');
      if (!select) return;
      const prev = select.value || state.activePlayerId;
      select.innerHTML = '<option value="">-- 請選擇選手查看賽程 --</option>';
      state.players.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${idx + 1}. ${p.name} (搶${p.race})`;
        select.appendChild(opt);
      });
      if (prev && state.players.some((p) => p.id === prev)) {
        select.value = prev;
      }
    }

    function renderPlayerPersonalStatus() {
      const select = document.getElementById('playerLookupSelect');
      const box = document.getElementById('playerPersonalStatusBox');
      if (!select || !box) return;

      const playerId = select.value;
      state.activePlayerId = playerId;

      if (!playerId) {
        box.innerHTML = '尚未選擇選手，請從上方下拉選單挑選選手查看個人賽程與戰績。';
        renderAll();
        return;
      }

      const player = getPlayerById(playerId);
      if (!player) {
        box.innerHTML = '找不到該名選手資料。';
        return;
      }

      const relatedMatches = state.matches.filter(
        (m) => m.p1Id === playerId || m.p2Id === playerId
      );

      let wins = 0;
      let losses = 0;
      const upcoming = [];

      relatedMatches.forEach((m) => {
        if (m.winnerId) {
          if (m.winnerId === playerId) wins += 1;
          else losses += 1;
        } else {
          const oppId = m.p1Id === playerId ? m.p2Id : m.p1Id;
          const opp = getPlayerById(oppId);
          upcoming.push({
            label: m.label || m.id || '場次',
            opponent: opp ? opp.name : (oppId ? '待定選手' : '輪空 / 待定')
          });
        }
      });

      const nextHtml = upcoming.length
        ? upcoming.slice(0, 3).map((u) => `<span class="inline-block mr-2 mb-1 px-2.5 py-1 rounded-lg bg-indigo-500/15 border border-indigo-500/30 text-indigo-200 text-xs">${escapeHtml(u.label)} vs ${escapeHtml(u.opponent)}</span>`).join('')
        : '<span class="text-slate-400 text-xs">目前無未完賽場次</span>';

      box.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div class="text-base font-black text-white">${escapeHtml(player.name)} <span class="text-xs font-semibold text-amber-300 ml-1">搶 ${player.race} 局</span></div>
            <div class="text-xs text-slate-400 mt-1">戰績：<strong class="text-emerald-400">${wins} 勝</strong> / <strong class="text-rose-400">${losses} 負</strong></div>
          </div>
          <div class="text-left sm:text-right">
            <div class="text-xs text-slate-400 mb-1">待進行場次</div>
            <div>${nextHtml}</div>
          </div>
        </div>
      `;

      renderAll();
    }

    function renderBracket() {
      const container = document.getElementById('bracketContainer');
      const modeBadge = document.getElementById('bracketModeBadge');
      if (!container) return;

      const modeTextMap = {
        single: '單敗淘汰賽',
        double: '雙敗淘汰賽',
        roundrobin: '循環賽制'
      };
      if (modeBadge) {
        modeBadge.textContent = modeTextMap[state.format] || '賽事賽程';
      }

      if (!Array.isArray(state.matches) || state.matches.length === 0) {
        container.innerHTML = '<div class="text-sm text-slate-400 py-6 text-center">快照中尚無對戰場次資料。</div>';
        return;
      }

      const roundMap = new Map();
      state.matches.forEach((m, idx) => {
        const rKey = m.roundName || `第 ${m.round || 1} 輪`;
        if (!roundMap.has(rKey)) roundMap.set(rKey, []);
        roundMap.get(rKey).push({ ...m, _idx: idx });
      });

      const roundsHtml = Array.from(roundMap.entries()).map(([roundTitle, list]) => {
        const cards = list.map((m) => {
          const p1 = getPlayerById(m.p1Id);
          const p2 = getPlayerById(m.p2Id);
          const p1Name = p1 ? p1.name : (m.p1Name || '待定 / BYE');
          const p2Name = p2 ? p2.name : (m.p2Name || '待定 / BYE');

          const isP1Highlighted = state.activePlayerId && m.p1Id === state.activePlayerId;
          const isP2Highlighted = state.activePlayerId && m.p2Id === state.activePlayerId;
          const isP1Win = m.winnerId && m.winnerId === m.p1Id;
          const isP2Win = m.winnerId && m.winnerId === m.p2Id;

          const s1 = m.s1 ?? m.score1 ?? '';
          const s2 = m.s2 ?? m.score2 ?? '';

          return `
            <div class="match-card-interactive bg-slate-950/90 border border-slate-800 rounded-xl p-3 min-w-[230px] space-y-1.5">
              <div class="flex items-center justify-between text-[11px] text-slate-400">
                <span>${escapeHtml(m.label || `第 ${m._idx + 1} 場`)}</span>
                <span>${m.winnerId ? '<span class="text-emerald-400 font-bold">已完賽</span>' : '<span class="text-amber-300">進行中/待賽</span>'}</span>
              </div>
              <div class="flex items-center justify-between px-2 py-1.5 rounded-lg ${isP1Win ? 'bg-emerald-500/15 border border-emerald-500/30' : 'bg-slate-900'} ${isP1Highlighted ? 'ring-1 ring-indigo-400' : ''}">
                <span class="text-xs font-bold truncate ${isP1Win ? 'text-emerald-300' : 'text-slate-200'}">${escapeHtml(p1Name)}</span>
                <span class="text-xs font-black text-white ml-2">${escapeHtml(s1)}</span>
              </div>
              <div class="flex items-center justify-between px-2 py-1.5 rounded-lg ${isP2Win ? 'bg-emerald-500/15 border border-emerald-500/30' : 'bg-slate-900'} ${isP2Highlighted ? 'ring-1 ring-indigo-400' : ''}">
                <span class="text-xs font-bold truncate ${isP2Win ? 'text-emerald-300' : 'text-slate-200'}">${escapeHtml(p2Name)}</span>
                <span class="text-xs font-black text-white ml-2">${escapeHtml(s2)}</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="inline-flex flex-col gap-3 align-top mr-4">
            <div class="text-xs font-black text-indigo-300 bg-indigo-950/60 border border-indigo-500/20 px-3 py-1.5 rounded-lg text-center">
              ${escapeHtml(roundTitle)}
            </div>
            <div class="flex flex-col gap-3">${cards}</div>
          </div>
        `;
      }).join('');

      container.innerHTML = `<div class="whitespace-nowrap">${roundsHtml}</div>`;
    }

    function renderPlayerStandings() {
      const container = document.getElementById('playerStandingsContainer');
      if (!container) return;

      if (!state.players.length) {
        container.innerHTML = '<div class="text-sm text-slate-400 col-span-full py-4 text-center">無選手資料</div>';
        return;
      }

      container.innerHTML = state.players.map((p, idx) => {
        const isSelected = state.activePlayerId === p.id;
        return `
          <div onclick="document.getElementById('playerLookupSelect').value='${escapeHtml(p.id)}'; renderPlayerPersonalStatus();"
            class="cursor-pointer rounded-xl p-3 border transition ${isSelected ? 'bg-indigo-950/60 border-indigo-400' : 'bg-slate-950/80 border-slate-800 hover:border-slate-700'}">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-400">#${idx + 1}</span>
              <span class="text-xs font-black px-2 py-0.5 rounded bg-slate-800 text-amber-300">搶 ${p.race}</span>
            </div>
            <div class="text-sm font-black text-white mt-1 truncate">${escapeHtml(p.name)}</div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      renderBracket();
      renderPlayerStandings();
    }

    function loadSnapshotFromHash() {
      const badge = document.getElementById('snapStatusBadge');
      const hash = window.location.hash || '';
      const snapMatch = hash.match(/snap=([A-Za-z0-9\-_=]+)/);

      if (!snapMatch || !snapMatch[1]) {
        if (badge) {
          badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1 text-amber-400"></i>網址未包含 #snap= 快照';
        }
        return false;
      }

      try {
        const snapObj = decodeSnapshotBase64Url(snapMatch[1]);
        const ok = applyTournamentPayload(snapObj, { skipSave: true });
        if (ok) {
          if (badge) {
            badge.innerHTML = '<i class="fa-solid fa-check-circle mr-1 text-emerald-400"></i>已載入唯讀快照';
          }
          return true;
        }
      } catch (err) {
        console.warn('Snapshot decode failed:', err);
      }

      if (badge) {
        badge.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1 text-rose-400"></i>快照格式無效或已損毀';
      }
      showToast('無法解析網址中的 #snap= 快照資料');
      return false;
    }

    document.addEventListener('DOMContentLoaded', () => {
      state.readOnlyViewer = true;
      state.viewerShareLocked = true;
      document.body.classList.add('viewer-readonly');
      loadSnapshotFromHash();
    });

    window.addEventListener('hashchange', () => {
      loadSnapshotFromHash();
    });
  </script>
</body>
</html>

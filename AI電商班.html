<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11月19日 謝師宴及同學結業聚餐統計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #a855f7;
      --neon-emerald: #10b981;
      --neon-rose: #f43f5e;
      --neon-amber: #f59e0b;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #050814;
      color: #e2e8f0;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .font-cyber {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
    }
    #ai-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .cyber-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at 50% 30%, black 40%, transparent 90%);
    }
    .glass-card {
      background: rgba(13, 20, 42, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 0 20px rgba(0, 243, 255, 0.05);
    }
    .glass-card-amber {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(13, 20, 42, 0.85));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.15);
    }
    .neon-glow-text {
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.6), 0 0 28px rgba(168, 85, 247, 0.4);
    }
    .cyber-btn {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.45);
      transition: all 0.25s ease;
    }
    .cyber-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.75);
    }
    .cyber-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .cyber-input {
      background: rgba(6, 11, 25, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .cyber-input:focus {
      outline: none;
      border-color: #00f3ff;
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.35);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070b19; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.35); border-radius: 999px; }
  </style>
</head>
<body class="relative antialiased selection:bg-cyan-500 selection:text-slate-950">

  <!-- AI 動態神經網絡背景 -->
  <canvas id="ai-canvas"></canvas>
  <div class="cyber-grid"></div>

  <!-- 主容器 -->
  <main class="relative z-10 max-w-4xl mx-auto px-4 py-8 sm:py-12 space-y-6">

    <!-- 頂部標題區塊 -->
    <header class="glass-card rounded-2xl p-6 sm:p-8 text-center relative
